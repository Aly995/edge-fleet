[defaults]
# Copy inventory/inventory.example.yml to inventory/inventory.yml and edit it.
inventory = inventory/inventory.yml
# Playbooks live in playbooks/, so point Ansible at the repo-root roles/.
roles_path = roles
collections_path = ./collections:~/.ansible/collections
interpreter_python = /usr/bin/python3
retry_files_enabled = False

# Scale: run against many devices in parallel. Raise for hundreds of devices.
forks = 20

# Cache facts so repeated runs against a large fleet skip re-gathering.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_cache
fact_caching_timeout = 3600

# Run handlers even when a later task fails. Without this, a boot-config change
# that notified "reboot device" is silently lost when the play dies afterwards,
# and re-running does not help: the config task is now "ok" and never notifies again.
force_handlers = True

# Human-readable output plus per-task timing.
stdout_callback = default
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# Fewer SSH round-trips per task; matters on cellular links.
pipelining = True
# Trust a device's host key on first contact, refuse it if it ever changes.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[privilege_escalation]
become = False
become_method = sudo
